<!doctype html>
<!-- Vendored: alpinejs@3.17.5 (cdn.jsdelivr.net/npm/alpinejs@3.17.5/dist/cdn.min.js),
     @fontsource/inter@5.3.0 latin 400/600/700 (cdn.jsdelivr.net/npm/@fontsource/inter@5.3.0/files/) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ad Cutter</title>
<link rel="stylesheet" href="style.css">
<!-- Module first: it registers stores on alpine:init before Alpine (deferred, same order) starts. -->
<script type="module" src="app.js"></script>
<script defer src="vendor/alpine.min.js"></script>
</head>
<body>
<div class="app" x-data x-cloak>
  <div class="panes">

    <!-- ── Sidebar ─────────────────────────────────────────────────────── -->
    <nav class="side" aria-label="Main">
      <div class="brand">Ad Cutter</div>
      <a href="#/" :class="{ active: $store.route.view === 'overview' }">
        <span>All episodes</span><span x-text="$store.feeds.total"></span>
      </a>
      <template x-for="f in $store.feeds.items" :key="f.slug">
        <a :href="`#/feed/${f.slug}`" :class="{ active: $store.route.view === 'feed' && $store.route.param === f.slug }">
          <span x-text="f.title"></span><span x-text="f.episode_count"></span>
        </a>
      </template>
      <hr>
      <a href="#/skipped" :class="{ active: $store.route.view === 'skipped' }"><span>Skipped</span></a>
      <a href="#/feeds" :class="{ active: $store.route.view === 'feeds' }"><span>Feeds</span></a>
      <a href="#/settings" :class="{ active: $store.route.view === 'settings' }"><span>Settings</span></a>
      <a href="#/logs" :class="{ active: $store.route.view === 'logs' }"><span>Logs</span></a>
    </nav>

    <!-- ── Episode list ─────────────────────────────────────────────────── -->
    <section class="list" x-data="episodeList" x-show="!$store.route.full" aria-label="Episodes">
      <div class="search"><input type="search" aria-label="Search titles" placeholder="Search titles" x-model="q" @input.debounce.300ms="search()"></div>
      <template x-for="e in items" :key="e.guid">
        <a class="ep" :class="{ selected: selected(e) }" :href="href(e)">
          <span class="small muted" x-text="fmt.date(e.pubdate, true)"></span>
          <span class="t" x-text="e.title"></span>
          <span class="small"><span class="dot" :style="`background: ${stateOf(e).color}`"></span><span x-text="stateOf(e).label"></span></span>
        </a>
      </template>
      <p class="small muted" style="padding: 12px 16px" x-show="!items.length">No episodes match.</p>
      <div class="pager">
        <span x-text="range"></span>
        <span class="row">
          <button :disabled="offset === 0" @click="page(-1)">Prev</button>
          <button :disabled="offset + limit >= total" @click="page(1)">Next</button>
        </span>
      </div>
    </section>

    <main class="main" :class="{ full: $store.route.full }">

      <!-- ── Run overview ───────────────────────────────────────────────── -->
      <template x-if="['overview', 'feed', 'skipped'].includes($store.route.view)">
        <section x-data="overview" style="display: flex; flex-direction: column; gap: 18px">
          <h1>Run overview</h1>
          <div class="tiles">
            <div class="tile"><div class="small muted">State</div><div class="v" style="color: var(--accent)" x-text="$store.status.state"></div></div>
            <div class="tile"><div class="small muted">Progress</div><div class="v" x-text="`${$store.status.done} / ${$store.status.total}`"></div></div>
            <div class="tile"><div class="small muted">Failed this run</div><div class="v" style="color: var(--fail)" x-text="$store.status.failedCount"></div></div>
            <div class="tile"><div class="small muted">LLM cost (all time)</div><div class="v" x-text="money(costs.total)"></div></div>
          </div>
          <div class="row">
            <button class="primary" x-show="$store.status.idle" @click="run()">Run all feeds</button>
            <button x-show="!$store.status.idle" @click="stop(false)">Stop after episode</button>
            <button class="danger" x-show="!$store.status.idle" @click="stop(true)">Force stop</button>
          </div>
          <div class="events">
            <h2>Event stream</h2>
            <template x-for="(ev, i) in $store.status.events" :key="i">
              <div><span class="muted" x-text="ev.t"></span><span x-text="ev.text"></span></div>
            </template>
            <p class="small muted" x-show="!$store.status.events.length">No events since this page opened.</p>
          </div>
          <div class="kv">
            <h2>Cost by model</h2>
            <template x-for="m in costs.by_model" :key="m.provider + m.model">
              <div><span x-text="`${m.provider}/${m.model}`"></span><span x-text="money(m.cost)"></span></div>
            </template>
          </div>
        </section>
      </template>

      <!-- ── Episode detail ─────────────────────────────────────────────── -->
      <template x-if="$store.route.view === 'episode'">
        <section x-data="episodeDetail" style="display: flex; flex-direction: column; gap: 16px">
          <template x-if="ep">
            <div style="display: flex; flex-direction: column; gap: 16px">
              <div class="row" style="justify-content: space-between; align-items: flex-start">
                <div>
                  <h1 x-text="ep.title"></h1>
                  <span class="small muted" x-text="[
                    fmt.date(ep.pubdate),
                    duration ? (ads.length ? `${fmt.time(duration)} → ≈${fmt.time(duration - adTotal)}` : fmt.time(duration)) : '',
                    ep.pipeline_state,
                  ].filter(Boolean).join(' · ')"></span>
                </div>
                <div class="row">
                  <button :disabled="!$store.status.idle" @click="toggleSkip()" x-text="skippedEp ? 'Enable' : 'Disable'"></button>
                  <label style="flex-direction: row; align-items: center; gap: 6px">
                    <span class="sr-only">Reprocess from</span>
                    <select x-model="stage" aria-label="Reprocess from stage">
                      <option value="">full</option><option>download</option><option>transcribe</option>
                      <option>topic</option><option>ad-detect</option><option>edit</option>
                    </select>
                  </label>
                  <button :disabled="!$store.status.idle" @click="reprocess()">Reprocess</button>
                  <button class="danger" :disabled="!$store.status.idle" @click="remove()">Delete</button>
                </div>
              </div>

              <!-- Timeline: original audio, ads in orange -->
              <div class="card" x-show="ep.source_url">
                <div class="row" style="font-size: 13px">
                  <button class="icon" :aria-label="playing ? 'Pause original' : 'Play original'" @click="toggle()">
                    <svg x-show="!playing" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5v11l9-5.5z" fill="currentColor"/></svg>
                    <svg x-show="playing" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5h3v11H3zM8 1.5h3v11H8z" fill="currentColor"/></svg>
                  </button>
                  <strong x-text="fmt.time(current)"></strong><span class="muted" x-text="`/ ${fmt.time(duration)} original`"></span>
                  <span class="muted" style="margin-left: auto" x-text="`${ads.length} ad(s) · ${fmt.time(adTotal)}`"></span>
                </div>
                <div class="timeline" @click="seekClick($event)" role="slider" tabindex="0" aria-label="Seek original audio"
                     :aria-valuenow="Math.round(current / 1000)" aria-valuemin="0" :aria-valuemax="Math.round(duration / 1000)"
                     @keydown.right.prevent="seek(current + 10000)" @keydown.left.prevent="seek(Math.max(0, current - 10000))">
                  <template x-for="(b, i) in blocks" :key="i"><div class="ad" :style="`left: ${b.left}; width: ${b.width}`"></div></template>
                  <div class="head" :style="`left: ${headPct}`"></div>
                </div>
                <div class="ticks"><template x-for="t in ticks" :key="t.pct"><span :style="`left: ${t.pct}`" x-text="t.label"></span></template></div>
                <audio x-ref="audio" :src="ep.source_url" preload="metadata"
                       @loadedmetadata="onMeta()" @timeupdate="current = $refs.audio.currentTime * 1000"
                       @play="playing = true" @pause="playing = false"></audio>
                <div class="small muted" x-show="ep.pipeline_state === 'complete'">
                  Cut version (timestamps differ): <a :href="ep.url" target="_blank" rel="noopener" x-text="ep.url"></a>
                </div>
              </div>

              <div class="cols">
                <div class="grow">
                  <h2>Transcript</h2>
                  <p class="small muted" x-show="missing.transcript">Not transcribed yet.</p>
                  <template x-for="s in segs" :key="s.start">
                    <button class="seg" :class="{ ad: adOf(s) }" :title="adOf(s) ? `Ad: ${adOf(s).sponsor}` : ''" @click="seek(s.start)">
                      <span class="ts" x-text="fmt.time(s.start)"></span><span x-text="s.text"></span>
                    </button>
                  </template>
                </div>
                <div class="aside">
                  <h2 x-text="`Ads · ${ads.length}`"></h2>
                  <p class="small muted" x-show="missing.ads">Ad detection has not run yet.</p>
                  <template x-for="a in ads" :key="a.start_ms">
                    <button class="adrow seg" style="display: block" @click="seek(a.start_ms)">
                      <div><strong x-text="a.sponsor"></strong> <span class="muted" x-text="`· ${a.confidence.toFixed(2)}`"></span></div>
                      <div class="r" x-text="`${fmt.time(a.start_ms)} – ${fmt.time(a.end_ms)}`"></div>
                      <div class="muted" x-text="a.ad_topic"></div>
                    </button>
                  </template>
                  <h2 style="margin-top: 8px">Topic</h2>
                  <p class="small muted" x-show="missing.topic">Topic extraction has not run yet.</p>
                  <template x-if="topic">
                    <div class="small" style="display: flex; flex-direction: column; gap: 4px">
                      <div><span class="muted">Show:</span> <span x-text="topic.show"></span></div>
                      <div><span class="muted">Hosts:</span> <span x-text="topic.hosts"></span></div>
                      <div><span class="muted">Topic:</span> <span x-text="topic.topic"></span></div>
                    </div>
                  </template>
                </div>
              </div>
            </div>
          </template>
        </section>
      </template>
      <!-- SETTINGS + FEEDS (task 4) -->
      <!-- LOGS (task 5) -->
    </main>
  </div>

  <!-- ── Status bar ────────────────────────────────────────────────────── -->
  <footer class="statusbar" aria-live="polite">
    <span><span class="dot" :style="`background: ${$store.status.idle ? 'var(--pending)' : 'var(--accent)'}`"></span><span x-text="$store.status.state"></span><span x-show="$store.status.active_feed_slug" x-text="` · ${$store.status.active_feed_slug}`"></span></span>
    <span x-show="$store.status.current_episode_guid"
          x-text="`${$store.titles.of($store.status.current_episode_guid)} · ${$store.status.stage ?? ''}${$store.status.percent !== null ? ' ' + $store.status.percent + '%' : ''}`"></span>
    <div class="bar" x-show="$store.status.total"><div :style="`width: ${$store.status.total ? Math.round(100 * $store.status.done / $store.status.total) : 0}%`"></div></div>
    <span x-text="$store.status.sse === 'connected' ? 'SSE connected' : 'SSE disconnected'"
          :style="$store.status.sse === 'connected' ? '' : 'color: var(--fail); font-weight: 600'"></span>
  </footer>

  <div class="toasts" aria-live="assertive">
    <template x-for="t in $store.toasts.items" :key="t.id">
      <div class="toast" :class="t.kind" x-text="t.msg"></div>
    </template>
  </div>
</div>
</body>
</html>
