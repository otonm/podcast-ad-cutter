[project]
name = "podcast-ad-cutter"
version = "0.1"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3",
    "aiosqlite>=0.22.1",
    "litellm>=1.82.6",
    "pydantic>=2",
    "pydantic-settings>=2",
    "python-dotenv>=1",
    "python-slugify>=8",
    "pyyaml>=6",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D107",
    "D203",
    "D213",
    "TRY003",
    "EM102",
    "G004",
    "PLR0913",
    "ERA001",
    "COM812",
    "D104",
    "T201",
    "TRY400",
]

[tool.ruff.lint.per-file-ignores]
# TC003, TC001: Types are used at runtime in pydantic field annotations
"config/config_loader.py" = ["TC003", "TC001"]
"tests/**/*.py" = ["S101", "ANN", "D101", "D102", "D103", "D400", "D403", "D415", "INP001", "SIM117", "S314", "SLF001", "PLR2004", "ARG001"]  # SIM117: nested with; S314: test XML is controlled; SLF001: direct private method testing; PLR2004: magic values in assertions are idiomatic; ARG001: pytest fixtures used for side-effects need not be referenced; D400/D403/D415: docstring style relaxed in tests

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:coroutine.*_execute_mock_call.*was never awaited:RuntimeWarning",
]

[dependency-groups]
dev = [
    "aioresponses>=0.7",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.7",
    "types-pyyaml>=6.0.12.20250915",
]
