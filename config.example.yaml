# List of feeds to process
feeds:
  - title: "My Podcast"
    url: "https://example.com/feed.rss"
    # Should the feed be processed or not
    enabled: true
    # How many episodes to keep in the feed and the output directory (older episodes will be deleted)
    episodes_to_keep: 10

# Models to use for each task
models:
  transcription:
    provider: "groq"
    model: "whisper-large-v3"
  context_extraction:
    provider: "groq"
    model: "llama-3.3-70b-versatile"
  ad_detection:
    provider: "groq"
    model: "llama-3.3-70b-versatile"

# Path configurations for various outputs and the cache
paths:
  output_dir: "./output"
  cache_dir: "./cache"
  data_dir: "./data"
  log_dir: "./logs"

# Ad detection settings
ad_detection:
  # Minimum duration of an ad in milliseconds
  min_duration: 10000
  # Minimum confidence score for an ad segment (0 to 1)
  min_confidence: 0.7

# Output settings for the processed audio files
output:
  file_type: "mp3"
  bitrate: "128k"

# Logging settings
log:
  level: "ERROR"
  to_file: false

# Base URL for the final rss feed that will be generated (used for constructing episode URLs)
base_url: "http://localhost:8080"
